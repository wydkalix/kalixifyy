<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101210"><meta name="description" content="Kalixify — your soundtrack, your mood.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>Kalixify — Music for your mood</title>
<style>
:root{color-scheme:dark;--bg:#101210;--panel:#1b1f19;--panel2:#282e25;--line:#343b30;--text:#f4f7f1;--muted:#a1a99b;--green:#a8f05b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100dvh}.sidebar{padding:22px 15px;background:#171a16;border-right:1px solid #292e26}.brand{font-size:25px;font-weight:900;letter-spacing:-1.5px;margin:3px 0 28px;display:flex;align-items:center;gap:9px}.logo{width:32px;height:32px;border-radius:10px;background:var(--green);color:#15200e;display:grid;place-items:center}.nav{width:100%;padding:12px;border:0;background:transparent;text-align:left;color:var(--muted);border-radius:9px;margin:2px 0}.nav.active,.nav:hover{background:var(--panel2);color:white}.sideheading{margin:27px 10px 10px;color:#788171;font-size:10px;letter-spacing:1.7px;font-weight:800}.playlistnav{display:block;width:100%;padding:9px 10px;border:0;background:none;color:#b8c0b1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{padding:23px 28px 125px;min-width:0;background:radial-gradient(ellipse at 70% -10%,#34462b,transparent 40%)}.top{display:flex;align-items:center;gap:12px;margin-bottom:30px}.search{display:flex;align-items:center;gap:9px;background:#252a23;border:1px solid #3a4234;border-radius:30px;padding:0 15px;max-width:440px;flex:1}.search input{width:100%;min-width:0;background:transparent;border:0;outline:none;padding:12px 0;color:white}.avatar{margin-left:auto;background:var(--green);color:#15200e;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:900}.eyebrow{color:var(--green);font-size:10px;letter-spacing:2px;font-weight:850}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;margin:8px 0}.sub{color:var(--muted);line-height:1.6;font-size:13px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0}.chip,.small{border:1px solid var(--line);border-radius:24px;padding:9px 14px;background:var(--panel2);font-size:12px}.chip.active{background:var(--green);border-color:var(--green);color:#18230f;font-weight:800}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px;gap:10px}.sectionhead h2{font-size:19px;margin:0;letter-spacing:-.5px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{display:flex;align-items:center;gap:10px;text-align:left;padding:0 9px 0 0;background:#252a22;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;font-size:12px;font-weight:750}.tile:hover,.card:hover{background:#30372a}.art{display:grid;place-items:center;flex-shrink:0;width:53px;height:53px;font-size:23px;background:linear-gradient(135deg,#bd9a76,#633d2d)}.art.purple{background:linear-gradient(135deg,#c7b3ed,#51417c)}.art.green{background:linear-gradient(135deg,#c3d7a1,#35614a)}.art.gold{background:linear-gradient(135deg,#f0ca73,#8c5622)}.art.pink{background:linear-gradient(135deg,#e6a9c0,#783b63)}.art.blue{background:linear-gradient(135deg,#8acbd9,#2c5077)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#1b1f19;border:1px solid #2c3328;border-radius:11px;padding:10px;cursor:pointer;min-width:0}.cover{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#35482d,#171a16);margin-bottom:11px;position:relative}.cover .play{position:absolute;bottom:8px;right:8px;width:35px;height:35px;border-radius:50%;background:var(--green);color:#18230f;display:grid;place-items:center}.card strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.card p{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 1px}.tracklist{width:100%;border-collapse:collapse}.tracklist th{text-align:left;color:#8e9785;font-size:11px;font-weight:500;border-bottom:1px solid var(--line);padding:12px 7px}.tracklist td{border-bottom:1px solid #272d24;padding:11px 7px;color:#cbd2c3;font-size:12px}.tracklist tbody tr:hover{background:#252b22;cursor:pointer}.trackname{color:white!important;font-weight:750}.tracksub{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}.like{background:none;border:0;color:var(--green);font-size:19px}.primary{border:0;background:var(--green);color:#18230f;font-weight:850;padding:10px 16px;border-radius:25px;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.player{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;gap:15px;background:#1b1f19f5;backdrop-filter:blur(15px);border-top:1px solid #394133;padding:11px 20px calc(11px + env(safe-area-inset-bottom))}.now{display:flex;align-items:center;gap:10px;min-width:0}.nowart{width:45px;height:45px;border-radius:7px;background:#34462b;display:grid;place-items:center;font-size:22px;flex-shrink:0}.nowtxt{min-width:0}.nowtxt strong,.nowtxt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nowtxt strong{font-size:12px}.nowtxt span{font-size:10px;color:var(--muted);margin-top:4px}.playercontrols{display:flex;align-items:center;justify-content:center;gap:13px}.ctrl{border:0;background:none;color:#c4cbbc;font-size:16px;padding:3px}.playbtn{border:0;border-radius:50%;width:37px;height:37px;background:var(--green);color:#18230f;font-weight:900}.timeline{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);margin-top:5px}input[type=range]{accent-color:var(--green);width:100%;min-width:0;height:4px}.volume{display:flex;align-items:center;justify-content:flex-end;gap:9px;color:var(--muted)}.volume input{max-width:95px}.hidden{display:none!important}.modal{position:fixed;z-index:10;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modalbox{width:100%;max-width:360px;background:#20251e;border:1px solid #41493a;border-radius:15px;padding:22px}.modalbox input{width:100%;padding:12px;border-radius:8px;background:#151914;border:1px solid var(--line);color:white;margin:12px 0}.modalactions{display:flex;justify-content:flex-end;gap:8px}.hint{font-size:10px;color:#87907e;line-height:1.6;margin-top:25px}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:15px 14px 145px}.top{margin-bottom:23px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.player{grid-template-columns:1fr auto;padding:9px 11px calc(9px + env(safe-area-inset-bottom));gap:7px}.playercontrols{grid-column:2;grid-row:1}.volume{display:none}.timeline{grid-column:1/-1;grid-row:2;margin:1px 0}.playercontrols .optional{display:none}.main h1{font-size:34px}.tracklist th:nth-child(3),.tracklist td:nth-child(3){display:none}}
@media(min-width:721px) and (max-width:960px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="logo">♫</span>kalixify</div>
<button class="nav active" data-view="home">⌂ &nbsp; Home</button><button class="nav" data-view="search">⌕ &nbsp; Search</button><button class="nav" data-view="library">▤ &nbsp; Your library</button><button class="nav" data-view="liked">♥ &nbsp; Liked songs</button>
<div class="sideheading">YOUR PLAYLISTS</div><div id="playlistNav"></div><button class="playlistnav" id="createSide">＋ Create playlist</button>
<p class="hint">YOUR MUSIC. YOUR MOOD.<br>Ad-free. No subscription in this demo.</p></aside>
<main class="main"><div class="top"><label class="search">⌕ <input id="searchInput" placeholder="What do you want to listen to?" aria-label="Search songs"></label><div class="avatar">K</div></div><div id="content"></div></main>
</div>
<div class="player"><div class="now"><div class="nowart" id="nowArt">♫</div><div class="nowtxt"><strong id="nowTitle">Choose a track</strong><span id="nowArtist">Welcome to Kalixify</span></div><button class="like" id="likeCurrent" aria-label="Like current song">♡</button></div>
<div><div class="playercontrols"><button class="ctrl optional" id="shuffle" title="Shuffle">⤨</button><button class="ctrl" id="previous" title="Previous">◀|</button><button class="playbtn" id="playPause" title="Play">▶</button><button class="ctrl" id="next" title="Next">|▶</button><button class="ctrl optional" id="repeat" title="Repeat">↻</button></div><div class="timeline"><span id="currentTime">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek through track"><span id="totalTime">0:00</span></div></div><div class="volume"><span>♫</span><input type="range" id="volume" min="0" max="1" step=".05" value=".7" aria-label="Volume"></div></div>
<div class="modal hidden" id="modal"><div class="modalbox"><h2 id="modalTitle">Create playlist</h2><p class="sub" id="modalHint">Give your playlist a name.</p><input id="modalInput" maxlength="60" placeholder="My playlist"><div class="modalactions"><button class="small" id="cancelModal">Cancel</button><button class="primary" id="confirmModal">Create</button></div></div></div>
<audio id="audio" preload="none"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id);
const tracks=[
{id:'t1',title:'Midnight Drive',artist:'SoundHelix Demo',emoji:'🌃',color:'',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{id:'t2',title:'Golden Hour',artist:'SoundHelix Demo',emoji:'🌅',color:'purple',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
{id:'t3',title:'Into the Wild',artist:'SoundHelix Demo',emoji:'🌿',color:'green',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'},
{id:'t4',title:'Afterglow',artist:'SoundHelix Demo',emoji:'🌇',color:'gold',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'},
{id:'t5',title:'Soft Focus',artist:'SoundHelix Demo',emoji:'🌸',color:'pink',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3'},
{id:'t6',title:'Blue Horizon',artist:'SoundHelix Demo',emoji:'🌊',color:'blue',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3'}
];
const defaults=[{id:'p1',name:'Late Night Vibes',songs:['t1','t5']},{id:'p2',name:'Chill Mix',songs:['t2','t3']},{id:'p3',name:'My Favorites',songs:['t4','t6']}];
let playlists=read('kalixify-playlists',defaults),liked=new Set(read('kalixify-liked',[])),view='home',activePlaylist=null,current=null,queue=[],qi=0,shuffle=false,repeat=false,modalMode='create';
function read(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):f}catch{return f}}
function save(){try{localStorage.setItem('kalixify-playlists',JSON.stringify(playlists));localStorage.setItem('kalixify-liked',JSON.stringify([...liked]))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const get=id=>tracks.find(t=>t.id===id)||tracks[0],fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function art(t){return `<div class="art ${t.color}">${t.emoji}</div>`}
function tile(t){return `<button class="tile" data-play="${t.id}">${art(t)}<span>${esc(t.title)}</span></button>`}
function card(t){return `<div class="card" data-play="${t.id}"><div class="cover">${t.emoji}<span class="play">▶</span></div><strong>${esc(t.title)}</strong><p>${esc(t.artist)}</p></div>`}
function rows(ids){return `<table class="tracklist"><thead><tr><th>#</th><th>Title</th><th>Artist</th><th>♥</th></tr></thead><tbody>${ids.map((id,i)=>{let t=get(id);return `<tr data-play="${t.id}"><td>${i+1}</td><td class="trackname">${esc(t.title)}<span class="tracksub">${esc(t.artist)}</span></td><td>${esc(t.artist)}</td><td><button class="like" data-like="${t.id}" aria-label="Like ${esc(t.title)}">${liked.has(t.id)?'♥':'♡'}</button></td></tr>`}).join('')}</tbody></table>`}
function section(title,body){return `<div class="sectionhead"><h2>${title}</h2></div>${body}`}
function home(){return `<div class="eyebrow">YOUR SOUNDTRACK STARTS HERE</div><h1>Feel every beat.</h1><p class="sub">A little less noise. A lot more music.</p><div class="chips"><button class="chip active" data-view="home">All</button><button class="chip" data-view="library">Playlists</button><button class="chip" data-view="liked">Liked songs</button></div>${section('Made for your mood',`<div class="tiles">${tracks.map(tile).join('')}</div>`)}${section('Discover your next loop',`<div class="cards">${tracks.slice(0,4).map(card).join('')}</div>`)}${section('Your playlists',`<div class="cards">${playlists.map(p=>`<div class="card" data-list="${p.id}"><div class="cover">♫</div><strong>${esc(p.name)}</strong><p>${p.songs.length} tracks · Your collection</p></div>`).join('')}</div>`)}<p class="hint">Demo audio only. A full commercial catalog requires streaming rights.</p>`}
function playlistPage(p){return `<div class="eyebrow">YOUR COLLECTION</div><div class="sectionhead"><h1>${esc(p.name)}</h1><button class="small" data-delete="${p.id}">Delete</button></div><p class="sub">${p.songs.length} tracks · Your personal playlist</p><div class="sectionhead"><button class="primary" data-playlist="${p.id}">▶ Play playlist</button><button class="small" data-add="${p.id}">＋ Add demo track</button></div>${p.songs.length?rows(p.songs):'<div class="empty">This playlist is empty. Add a demo track to begin.</div>'}`}
function render(){let q=$('searchInput').value.trim().toLowerCase(),html='';if(q){view='search';let found=tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q));html=`<div class="eyebrow">SEARCH RESULTS</div><h1>Find your sound.</h1><p class="sub">Matching tracks in this demo catalog.</p>${found.length?rows(found.map(t=>t.id)):'<div class="empty">No matching songs. Try another search.</div>'}`}else if(view==='home')html=home();else if(view==='search')html=`<div class="eyebrow">DISCOVER</div><h1>Search music.</h1><p class="sub">Search the demo track catalog above.</p>${rows(tracks.map(t=>t.id))}`;else if(view==='liked')html=`<div class="eyebrow">YOUR COLLECTION</div><h1>Liked songs ♥</h1><p class="sub">Songs saved for later.</p>${liked.size?rows([...liked]):'<div class="empty">Tap ♡ next to a track to save it here.</div>'}`;else if(view==='library')html=`<div class="eyebrow">YOUR COLLECTION</div><div class="sectionhead"><h1>Your library.</h1><button class="primary" id="createMain">＋ Create</button></div><p class="sub">Playlists are saved on this device.</p><div class="cards">${playlists.map(p=>`<div class="card" data-list="${p.id}"><div class="cover">♫</div><strong>${esc(p.name)}</strong><p>${p.songs.length} tracks</p></div>`).join('')}</div>${section('All demo tracks',rows(tracks.map(t=>t.id)))}`
else if(view==='playlist'){let p=playlists.find(x=>x.id===activePlaylist);html=p?playlistPage(p):home()}
$('content').innerHTML=html;$('playlistNav').innerHTML=playlists.map(p=>`<button class="playlistnav" data-list="${p.id}">♫ ${esc(p.name)}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function switchView(v){view=v;activePlaylist=null;$('searchInput').value='';render()}
function updateMediaSession(){if(!('mediaSession'in navigator)||!current)return;try{navigator.mediaSession.metadata=new MediaMetadata({title:current.title,artist:current.artist,album:'Kalixify',artwork:[]});navigator.mediaSession.playbackState=$('audio').paused?'paused':'playing';if(Number.isFinite($('audio').duration)&&$('audio').duration>0&&navigator.mediaSession.setPositionState){navigator.mediaSession.setPositionState({duration:$('audio').duration,playbackRate:$('audio').playbackRate,position:Math.min($('audio').currentTime,$('audio').duration)})}}catch(e){}}
function play(id){current=get(id);if(!queue.length)queue=tracks.map(t=>t.id);qi=Math.max(0,queue.indexOf(id));$('audio').src=current.url;$('audio').volume=+$('volume').value;$('nowTitle').textContent=current.title;$('nowArtist').textContent=current.artist;$('nowArt').textContent=current.emoji;$('nowArt').className='nowart '+current.color;$('likeCurrent').textContent=liked.has(id)?'♥':'♡';$('playPause').textContent='Ⅱ';updateMediaSession();$('audio').play().then(()=>{$('playPause').textContent='Ⅱ';updateMediaSession()}).catch(()=>{$('playPause').textContent='▶';updateMediaSession();$('nowArtist').textContent='Audio host unavailable — try again'});render()}
function next(){if(!queue.length)queue=tracks.map(t=>t.id);qi=shuffle?Math.floor(Math.random()*queue.length):(qi+1)%queue.length;play(queue[qi])}
function toggleLike(id){liked.has(id)?liked.delete(id):liked.add(id);save();$('likeCurrent').textContent=current&&liked.has(current.id)?'♥':'♡';render()}
function openModal(mode){modalMode=mode;$('modalTitle').textContent=mode==='create'?'Create playlist':'Add a demo track';$('modalHint').textContent=mode==='create'?'Give your playlist a name.':'Enter a track number from 1 to 6.';$('modalInput').value='';$('modalInput').placeholder=mode==='create'?'My playlist':'Track number (1–6)';$('confirmModal').textContent=mode==='create'?'Create':'Add track';$('modal').classList.remove('hidden');$('modalInput').focus()}
function closeModal(){$('modal').classList.add('hidden')}
$('content').addEventListener('click',e=>{let b=e.target.closest('button,[data-play],[data-list]');if(!b)return;if(b.dataset.view){switchView(b.dataset.view);return}if(b.dataset.play){play(b.dataset.play);return}if(b.dataset.like){e.stopPropagation();toggleLike(b.dataset.like);return}if(b.dataset.list){view='playlist';activePlaylist=b.dataset.list;$('searchInput').value='';render();return}if(b.dataset.playlist){let p=playlists.find(x=>x.id===b.dataset.playlist);if(p&&p.songs.length){queue=p.songs.slice();play(queue[0])}return}if(b.dataset.add){activePlaylist=b.dataset.add;openModal('add');return}if(b.dataset.delete){playlists=playlists.filter(p=>p.id!==b.dataset.delete);save();switchView('library');return}if(b.id==='createMain')openModal('create')});
$('playlistNav').addEventListener('click',e=>{let b=e.target.closest('[data-list]');if(b){view='playlist';activePlaylist=b.dataset.list;render()}});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
$('createSide').onclick=()=>openModal('create');$('cancelModal').onclick=closeModal;
$('confirmModal').onclick=()=>{let val=$('modalInput').value.trim();if(modalMode==='create'){if(!val)return;playlists.push({id:'p'+Date.now(),name:val,songs:[]});save();closeModal();switchView('library')}else{let p=playlists.find(x=>x.id===activePlaylist),n=Number(val);if(p&&Number.isInteger(n)&&n>=1&&n<=6){p.songs.push(tracks[n-1].id);save();closeModal();render()}else{$('modalHint').textContent='Enter a whole number from 1 to 6.'}}};
$('modalInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('confirmModal').click()});$('searchInput').addEventListener('input',render);
$('playPause').onclick=()=>{if(!current){play('t1');return}if($('audio').paused){$('audio').play().then(()=>{$('playPause').textContent='Ⅱ';updateMediaSession()}).catch(()=>{})}else{$('audio').pause();$('playPause').textContent='▶';updateMediaSession()}};
if('mediaSession'in navigator){try{navigator.mediaSession.setActionHandler('play',()=>{$('audio').play().then(()=>{$('playPause').textContent='Ⅱ';updateMediaSession()}).catch(()=>{})});navigator.mediaSession.setActionHandler('pause',()=>{$('audio').pause();$('playPause').textContent='▶';updateMediaSession()});navigator.mediaSession.setActionHandler('previoustrack',()=>$('previous').click());navigator.mediaSession.setActionHandler('nexttrack',()=>$('next').click());navigator.mediaSession.setActionHandler('seekto',e=>{if(Number.isFinite(e.seekTime))$('audio').currentTime=e.seekTime})}catch(e){}}
$('next').onclick=next;$('previous').onclick=()=>{if($('audio').currentTime>3){$('audio').currentTime=0;return}qi=(qi-1+queue.length)%queue.length;play(queue[qi]||'t1')};
$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').style.color=shuffle?'var(--green)':''};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').style.color=repeat?'var(--green)':'';$('audio').loop=repeat};
$('likeCurrent').onclick=()=>{if(current)toggleLike(current.id)};$('volume').oninput=()=>{$('audio').volume=+$('volume').value};
$('audio').addEventListener('timeupdate',()=>{$('currentTime').textContent=fmt($('audio').currentTime);$('totalTime').textContent=fmt($('audio').duration);$('seek').value=$('audio').duration?$('audio').currentTime/$('audio').duration*100:0;if(Math.floor($('audio').currentTime)%10===0)updateMediaSession()});
$('audio').addEventListener('play',()=>{$('playPause').textContent='Ⅱ';updateMediaSession()});$('audio').addEventListener('pause',()=>{$('playPause').textContent='▶';updateMediaSession()});$('audio').addEventListener('loadedmetadata',updateMediaSession);
$('seek').oninput=()=>{if($('audio').duration)$('audio').currentTime=+$('seek').value/100*$('audio').duration};$('audio').addEventListener('ended',()=>{if(!repeat)next()});$('audio').addEventListener('error',()=>{if(current)$('nowArtist').textContent='Stream unavailable — check internet or try another track'});
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body></html>
